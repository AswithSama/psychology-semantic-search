[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psychology-semantic-search"
version = "0.1.0"
description = "Section-aware psychology textbook PDF indexing and semantic retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pypdf>=5,<7",
  "spacy>=3.7,<4",
  "chromadb>=1.0,<2",
  "sentence-transformers>=3,<6",
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "pydantic-settings>=2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
psych-search = "psych_search.cli:main"

[tool.setuptools.package-data]
psych_search = ["static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
